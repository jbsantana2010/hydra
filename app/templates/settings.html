{% extends "base.html" %}

{% block content %}
  <h2>Settings</h2>

  <section class="panel" style="margin: 18px 0;">
    <h3>Kill Switch</h3>
    <p>
      Current state:
      {% if kill_switch_active %}
        <span class="status paused">enabled</span>
      {% else %}
        <span class="status live">disabled</span>
      {% endif %}
    </p>
    <div class="actions">
      <form method="post" action="/settings/kill-switch">
        <input type="hidden" name="enabled" value="true">
        <button type="submit">Enable</button>
      </form>
      <form method="post" action="/settings/kill-switch">
        <input type="hidden" name="enabled" value="false">
        <button class="secondary" type="submit">Disable</button>
      </form>
    </div>
  </section>

  <section class="panel">
    <h3>Daily Budget</h3>
    <p class="muted">Current value: ${{ "%.2f"|format(daily_budget) }}</p>
    <form class="form-grid" method="post" action="/settings/budget">
      <label>
        Daily budget USD
        <input name="daily_budget_usd" type="number" min="0" step="0.01" value="{{ daily_budget }}">
      </label>
      <button type="submit">Update Budget</button>
    </form>
  </section>
{% endblock %}
